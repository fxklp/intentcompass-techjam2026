name: Cross-Platform CI

on:
  push:
    branches: [ "qa/TASK-103-cross-platform-release", "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  verify-cross-platform:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Prepare Data
      run: python scripts/setup_data.py

    - name: Run 29 tests + cross platform contract
      run: python -m unittest discover -s tests -p "test_*.py"

    - name: Run Demo
      run: python demo/run_demo.py

    - name: Run Team Gate
      run: python scripts/team_gate.py --full-eval
